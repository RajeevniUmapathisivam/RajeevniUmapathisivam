<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Rajeevni Umapathisivam — Development and design</title>
<desc id="desc">Building thoughtful digital experiences. Full-stack web development, UI/UX and Human-Computer Interaction. A gently floating interface illustration with orbiting accents.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1120"/><stop offset="1" stop-color="#17243c"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#66e5cc"/><stop offset="1" stop-color="#b4a5ff"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#5874b9" stop-opacity=".25"/><stop offset="1" stop-color="#5874b9" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b1c5e9" stroke-opacity=".035"/></pattern>
<style>
.orbit{transform-origin:975px 200px;animation:orbit 24s linear infinite}
.float{animation:float 7s ease-in-out infinite}
.trace{stroke-dasharray:50 500;animation:trace 12s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes trace{to{stroke-dashoffset:-550}}
@media(prefers-reduced-motion:reduce){.orbit,.float,.trace{animation:none}}
</style>
</defs>
<rect width="1200" height="400" rx="22" fill="url(#bg)"/>
<rect width="1200" height="400" rx="22" fill="url(#grid)"/>
<ellipse cx="965" cy="205" rx="300" ry="240" fill="url(#glow)"/>
<path d="M64 48H1136" stroke="#26344d"/>
<path d="M64 48H1136" stroke="url(#accent)" stroke-width="2" class="trace"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="64" y="89" fill="#80e2d0" font-size="13" letter-spacing="3">DEVELOPMENT / DESIGN / HUMAN EXPERIENCE</text>
<text x="60" y="154" fill="#f3f6ff" font-size="44" font-weight="700">Rajeevni</text>
<text x="60" y="207" fill="#f3f6ff" font-size="44" font-weight="700">Umapathisivam<tspan fill="#80e2d0">.</tspan></text>
<text x="64" y="249" fill="#c3cfe2" font-size="21">Building thoughtful digital experiences.</text>
<text x="64" y="282" fill="#8fa2be" font-size="16">Full-stack web development · UI/UX · HCI</text>
<rect x="64" y="320" width="127" height="31" rx="15.5" fill="#142f35" stroke="#2c5759"/>
<text x="127" y="340" text-anchor="middle" fill="#9ce9d8" font-size="12" letter-spacing="1">BUILD WITH CARE</text>
<text x="211" y="340" fill="#94a5bf" font-size="13">IT undergraduate · University of Vavuniya</text>
</g>
<g fill="none" stroke="#34425f"><circle cx="975" cy="200" r="164" stroke-dasharray="3 9"/><circle cx="975" cy="200" r="135" opacity=".6"/></g>
<g class="orbit"><circle cx="1139" cy="200" r="5" fill="#88e9d5"/><circle cx="811" cy="200" r="4" fill="#b7a6ff"/></g>
<g class="float">
<rect x="840" y="111" width="268" height="182" rx="14" fill="#080e1a" opacity=".5" transform="translate(0 10)"/>
<rect x="840" y="111" width="268" height="182" rx="14" fill="#141f34" stroke="#41516e"/>
<path d="M840 145H1108" stroke="#35435d"/>
<g fill="#65758f"><circle cx="858" cy="128" r="3"/><circle cx="870" cy="128" r="3"/><circle cx="882" cy="128" r="3"/></g>
<text x="1088" y="132" text-anchor="end" fill="#91a3bf" font-family="monospace" font-size="10">interface.tsx</text>
<rect x="858" y="165" width="66" height="108" rx="7" fill="#1e3046"/>
<path d="M871 182H911M871 196H902M871 210H906" stroke="#7c91ad" stroke-width="3" stroke-linecap="round"/>
<rect x="940" y="165" width="147" height="44" rx="7" fill="#243b4d"/>
<path d="M953 180H1029M953 193H1009" stroke="#83dfcb" stroke-width="4" stroke-linecap="round"/>
<rect x="940" y="220" width="68" height="53" rx="7" fill="#302e4f"/>
<rect x="1019" y="220" width="68" height="53" rx="7" fill="#203c44"/>
<path d="m960 239-7 7 7 7m24-14 7 7-7 7m-9-19-5 24" fill="none" stroke="#bdadff" stroke-width="2" stroke-linecap="round"/>
<path d="m1038 247 10 8 19-22" fill="none" stroke="#83dfcb" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>
